services:
  - type: web
    name: neurostamp
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: NEUROSTAMP_SECRET_KEY
        generateValue: true       # Render auto-generates a 64-char hex AES-256 key
      - key: NEUROSTAMP_APP_SECRET
        generateValue: true       # Render auto-generates session signing secret
      - key: DATABASE_URL
        sync: false               # Set manually in Render dashboard — keeps it out of git
      - key: NEUROSTAMP_SECURE_COOKIES
        value: "true"             # Enable secure cookies since Render runs behind HTTPS
