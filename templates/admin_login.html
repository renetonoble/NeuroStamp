<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NeuroStamp — Admin Access</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-green: #00ff9d;
            --docker-blue: #0db7ed;
            --danger: #ff0055;
            --bg: #050505;
            --surface: #0e0e0e;
            --border: #1a1a1a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: #e0e0e0;
            font-family: 'JetBrains Mono', monospace;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image:
                linear-gradient(to right, rgba(128, 128, 128, 0.04) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(128, 128, 128, 0.04) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        /* Floating particles */
        .particle {
            position: fixed;
            width: 2px;
            height: 2px;
            background: var(--docker-blue);
            border-radius: 50%;
            opacity: 0;
            animation: float-up 8s infinite ease-in;
        }

        @keyframes float-up {
            0% { transform: translateY(100vh); opacity: 0; }
            10% { opacity: 0.4; }
            90% { opacity: 0.2; }
            100% { transform: translateY(-10px); opacity: 0; }
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .docker-icon {
            text-align: center;
            margin-bottom: 30px;
        }

        .docker-whale {
            font-size: 48px;
            line-height: 1;
            margin-bottom: 8px;
        }

        .docker-title {
            font-family: 'Rajdhani', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: white;
            letter-spacing: 4px;
        }

        .docker-title span {
            color: var(--docker-blue);
        }

        .docker-subtitle {
            font-size: 10px;
            color: #444;
            letter-spacing: 3px;
            margin-top: 4px;
            text-transform: uppercase;
        }

        .auth-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(13, 183, 237, 0.05);
        }

        .card-header {
            background: rgba(0, 0, 0, 0.5);
            border-bottom: 1px solid var(--border);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-dot {
            width: 10px; height: 10px;
            border-radius: 50%;
        }
        .header-dot.blue { background: var(--docker-blue); }
        .header-dot.green { background: var(--neon-green); }
        .header-dot.red { background: var(--danger); }

        .header-text {
            font-size: 11px;
            color: #555;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-left: 8px;
        }

        .auth-form {
            padding: 30px 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 10px;
            color: #555;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border);
            color: white;
            padding: 14px 16px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            border-radius: 6px;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            border-color: var(--docker-blue);
            box-shadow: 0 0 15px rgba(13, 183, 237, 0.15);
            background: rgba(0, 0, 0, 0.8);
        }

        .form-input::placeholder { color: #333; }

        .msg-box {
            display: none;
            padding: 12px 16px;
            font-size: 11px;
            border-radius: 6px;
            text-align: center;
            font-weight: 500;
            margin-bottom: 20px;
            animation: shake 0.4s ease;
        }

        .msg-box.error {
            display: block;
            background: rgba(255, 0, 85, 0.08);
            border: 1px solid rgba(255, 0, 85, 0.3);
            color: var(--danger);
        }

        .msg-box.success {
            display: block;
            background: rgba(0, 255, 157, 0.08);
            border: 1px solid rgba(0, 255, 157, 0.3);
            color: var(--neon-green);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: transparent;
            border: 1px solid var(--docker-blue);
            color: var(--docker-blue);
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .submit-btn::before {
            content: "";
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(13, 183, 237, 0.1), transparent);
            transition: left 0.5s;
        }

        .submit-btn:hover {
            background: var(--docker-blue);
            color: #000;
            box-shadow: 0 0 30px rgba(13, 183, 237, 0.3);
        }

        .submit-btn:hover::before { left: 100%; }
        .submit-btn:active { transform: scale(0.98); }

        .card-footer {
            background: rgba(0, 0, 0, 0.4);
            border-top: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            font-size: 9px;
            color: #444;
            letter-spacing: 1px;
        }

        .card-footer .active-indicator { color: var(--docker-blue); }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 11px;
            color: #444;
            text-decoration: none;
            letter-spacing: 2px;
            transition: color 0.3s;
        }

        .back-link:hover { color: var(--docker-blue); }

        .scan-line {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--docker-blue), transparent);
            opacity: 0.15;
            animation: scan-down 6s linear infinite;
            pointer-events: none;
            z-index: 100;
        }

        @keyframes scan-down {
            0% { top: -2px; }
            100% { top: 100vh; }
        }
    </style>
</head>
<body>

    <div class="scan-line"></div>

    <div class="particle" style="left: 10%; animation-delay: 0s;"></div>
    <div class="particle" style="left: 25%; animation-delay: 1.5s;"></div>
    <div class="particle" style="left: 40%; animation-delay: 3s;"></div>
    <div class="particle" style="left: 55%; animation-delay: 0.8s;"></div>
    <div class="particle" style="left: 70%; animation-delay: 4s;"></div>
    <div class="particle" style="left: 85%; animation-delay: 2.2s;"></div>
    <div class="particle" style="left: 95%; animation-delay: 5s;"></div>

    <div class="login-container">

        <div class="docker-icon">
            <div class="docker-whale">🔐</div>
            <div class="docker-title">ADMIN <span>ACCESS</span></div>
            <div class="docker-subtitle">NeuroStamp Administration Portal</div>
        </div>

        <div class="auth-card">
            <div class="card-header">
                <div class="header-dot blue"></div>
                <div class="header-dot green"></div>
                <div class="header-dot red"></div>
                <span class="header-text">Secure Authentication</span>
            </div>

            <form class="auth-form" id="adminAuthForm" onsubmit="handleAdminAuth(event)">

                <div id="msgBox" class="msg-box"></div>

                <div class="form-group">
                    <label class="form-label">Admin Username</label>
                    <input type="text" class="form-input" id="adminUser" placeholder="admin_user" required autocomplete="off">
                </div>

                <div class="form-group">
                    <label class="form-label">Access Token</label>
                    <input type="password" class="form-input" id="adminPass" placeholder="••••••••••••" required>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">
                    Authenticate
                </button>
            </form>

            <div class="card-footer">
                <span>PROTOCOL: <span class="active-indicator">TLS 1.3</span></span>
                <span>CIPHER: <span class="active-indicator">AES-256-GCM</span></span>
                <span>STATUS: <span class="active-indicator">ONLINE</span></span>
            </div>
        </div>

        <a href="/dashboard" class="back-link">← RETURN TO DASHBOARD</a>
    </div>

    <script>
        async function handleAdminAuth(e) {
            e.preventDefault();
            const msgBox = document.getElementById('msgBox');
            const btn = document.getElementById('submitBtn');
            const username = document.getElementById('adminUser').value;
            const password = document.getElementById('adminPass').value;

            btn.innerText = "VERIFYING...";
            btn.disabled = true;
            msgBox.className = 'msg-box';

            const formData = new FormData();
            formData.append('username', username);
            formData.append('password', password);

            try {
                const res = await fetch('/admin-auth', { method: 'POST', body: formData });
                const data = await res.json();

                if (data.status === 'success') {
                    msgBox.className = 'msg-box success';
                    msgBox.innerText = '✓ ACCESS GRANTED — REDIRECTING...';
                    setTimeout(() => {
                        window.location.href = '/admin-panel';
                    }, 800);
                } else {
                    msgBox.className = 'msg-box error';
                    msgBox.innerText = '✕ ' + (data.message || 'INVALID CREDENTIALS');
                    btn.innerText = "AUTHENTICATE";
                    btn.disabled = false;
                }
            } catch(err) {
                msgBox.className = 'msg-box error';
                msgBox.innerText = '✕ CONNECTION FAILED';
                btn.innerText = "AUTHENTICATE";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
